# The admin BFF server assembly document: one lifecycle, one http
# transport carrying the admin route surface behind its edge (the CORS
# policy and the request budget). The SSE notification transport joins
# with the notification domain's landing.
app:
  name: admin-service
  version: 0.0.1
# 进程级 panic 汇报：装配期插上默认 reporter（tracing 目标
# rushwind.panic），守卫随装配生命周期卸下。省略本节同为开启——
# 显式落节只为让运维找得到这个开关。
panic_reporting:
  enabled: true
servers:
  - kind: http
    bind: ":10600"
    edge:
      timeout: 10s
      cors:
        credentials: true
        headers:
          - "X-Requested-With"
          - "X-Request-ID"
          - "Content-Type"
          - "Authorization"
          - "X-Captcha-Id"
          - "X-Captcha-Value"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "HEAD"
          - "OPTIONS"
        origins:
          # 本地开发端口（admin 前端 vite dev；实际端口跟随前端 env）
          - "http://localhost:5173"
          - "http://127.0.0.1:5173"
          - "http://localhost:5999"
          - "http://127.0.0.1:5999"
    route_packs:
      - name: admin-surface
