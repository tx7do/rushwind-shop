# The app BFF server assembly document: one lifecycle, one http
# transport carrying the admin route surface behind its edge (the CORS
# policy and the request budget). The SSE notification transport joins
# with the notification domain's landing.
app:
  name: app-service
  version: 0.0.1
servers:
  - kind: http
    bind: ":10700"
    edge:
      timeout: 10s
      cors:
        credentials: true
        headers:
          - "X-Requested-With"
          - "X-Request-ID"
          - "Content-Type"
          - "Authorization"
          - "X-Captcha-Id"
          - "X-Captcha-Value"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "HEAD"
          - "OPTIONS"
        origins:
          # 本地开发端口（admin 前端 vite dev；实际端口跟随前端 env）
          - "http://localhost:5173"
          - "http://127.0.0.1:5173"
          - "http://localhost:5999"
          - "http://127.0.0.1:5999"
    route_packs:
      - name: app-surface
