# Development middleware for RushWind Shop — credentials mirror the
# embedded configs (app/*/service/assets/data.yaml). Start with:
#   docker compose -f docker-compose.libs.yaml up -d
name: rushwind-shop-libs

services:
  postgres:
    image: postgres:16
    container_name: rushwind-shop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "*Abcd123456"
      POSTGRES_DB: rushwind_shop
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rushwind_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: rushwind-shop-redis
    command: ["redis-server", "--requirepass", "*Abcd123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: rushwind-shop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: "*Abcd123456"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  redis_data:
  minio_data:
